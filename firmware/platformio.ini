; =====================================================================
; PROJETO: CARROSSEL INTELIGENTE COM ESP32 CONVENCIONAL
; Configuração PlatformIO para ESP32 (ESP32-WROOM-32 / esp32dev)
; NÃO UTILIZAR ESP32-S3 ou ESP32-C3
; =====================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Bibliotecas requeridas:
; - ArduinoJson (Serialização de comandos e telemetria)
; - WebSocketsServer (Comunicação em tempo real para o site)
; - ESPAsyncWebServer / WiFi / BLE (nativas ou gerenciadas)
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    links2004/WebSockets @ ^2.4.1

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
